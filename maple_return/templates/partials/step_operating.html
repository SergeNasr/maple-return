<h2>Step 3: Operating Details</h2>

<div class="wizard-form">
    <div class="form-group">
        <label for="monthly_rent">Monthly Rent (CAD)</label>
        <input type="number" id="monthly_rent" name="monthly_rent"
               step="0.01" min="0" placeholder="e.g. 2500" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="vacancy_rate">Vacancy Rate (decimal)</label>
        <input type="number" id="vacancy_rate" name="vacancy_rate"
               step="0.01" min="0" max="1" placeholder="e.g. 0.05 for 5%" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="property_tax_annual">Annual Property Tax (CAD)</label>
        <input type="number" id="property_tax_annual" name="property_tax_annual"
               step="0.01" min="0" placeholder="e.g. 4000" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="insurance_annual">Annual Insurance (CAD)</label>
        <input type="number" id="insurance_annual" name="insurance_annual"
               step="0.01" min="0" placeholder="e.g. 1800" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="maintenance_annual">Annual Maintenance (CAD)</label>
        <input type="number" id="maintenance_annual" name="maintenance_annual"
               step="0.01" min="0" placeholder="e.g. 2400" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="management_fee_rate">Management Fee Rate (decimal)</label>
        <input type="number" id="management_fee_rate" name="management_fee_rate"
               step="0.01" min="0" max="1" placeholder="e.g. 0.10 for 10%" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="rent_escalation_rate">Annual Rent Escalation (decimal)</label>
        <input type="number" id="rent_escalation_rate" name="rent_escalation_rate"
               step="0.001" min="0" max="1" placeholder="e.g. 0.02 for 2%" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="expense_escalation_rate">Annual Expense Escalation (decimal)</label>
        <input type="number" id="expense_escalation_rate" name="expense_escalation_rate"
               step="0.001" min="0" max="1" placeholder="e.g. 0.02 for 2%" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="cad_per_usd">CAD per USD (exchange rate)</label>
        <input type="number" id="cad_per_usd" name="cad_per_usd"
               step="0.01" min="0" placeholder="e.g. 1.35" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>
</div>
