<h2>Step 5: Exit Strategy</h2>

<div class="wizard-form">
    <div class="form-group">
        <label for="sale_price">Target Sale Price (CAD)</label>
        <input type="number" id="sale_price" name="sale_price"
               step="0.01" min="0" placeholder="e.g. 600000" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="sale_year">Year of Sale (years from purchase)</label>
        <input type="number" id="sale_year" name="sale_year"
               min="1" max="30" placeholder="e.g. 5" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="commission_rate">Commission Rate (decimal)</label>
        <input type="number" id="commission_rate" name="commission_rate"
               step="0.001" min="0" max="1" placeholder="e.g. 0.05 for 5%" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>

    <div class="form-group">
        <label for="closing_costs">Closing Costs (CAD)</label>
        <input type="number" id="closing_costs" name="closing_costs"
               step="0.01" min="0" placeholder="e.g. 5000" required
               onblur="autoSave(this.name, this.value)">
        <span class="error-message"></span>
    </div>
</div>
